alpha: |
  The threshold chosen in Neyman-Pearson hypothesis testing to distinguish test results that lead to the decision to reject the null hypothesis, or not, based on the desired upper bound of the Type 1 error rate. An alpha level of 5% is most commonly used, but other alpha levels can be used as long as they are determined and preregistered by the researcher before the data is analyzed.
p-value: |
  The probability of the observed data, or more extreme data, if the null hypothesis is true. The lower the p-value, the higher the test statistic, and the less likely it is to observe the data if the null hypothesis is true.
console: |
  The R console is the interactive interface within the R environment where users can type and execute R code. It is the place where you can directly enter commands, see their output, and interact with the R programming language in real-time.
tidy data: |
  Tidy data refers to a specific format for organizing datasets that makes data easier to work with for analysis and visualization in R, especially using the tidyverse. The concept was popularized by Hadley Wickham in his paper "Tidy Data" and is an essential principle for effective data manipulation.
pipe: |
  An operator that allows you to chain multiple functions together in a sequence.
blank slate: |
  R projects are set not to store their .Rhistory file, which means everything required to recreate your analysis is contained in your scripts.
snake case: |
  Snake case is a naming convention in computing that uses underscores to replace spaces between words, and writes words in lowercase. It's commonly used for variable names, filenames, and database table and column names.
normal distribution: |
  Also known as the "Gaussian distribution," it is a probability distribution that is symmetric about the mean, showing that data near the mean are more frequent in occurrence than data far from the mean.
correlation coefficient: |
  A numerical value ranging from -1 to 1 that measures the strength and direction of the linear relationship between two variables.
scatterplot: |
  A graph that displays the relationship between two numerical variables by plotting data points on an X and Y axis.
confounding variable: |
  A variable that affects both the independent and dependent variables, potentially distorting the observed relationship between them.
bias: |
  A systematic error or distortion in data collection or analysis that leads to inaccurate conclusions or results.
central tendency: |
  A statistical measure that identifies the center or typical value in a dataset, often represented by the mean, median, or mode.
variation: |
  A measure of how spread out or dispersed the data points are in relation to each other or the central value.
histogram: |
  A graphical representation of the distribution of a dataset by grouping data into bins and showing the frequency of observations within each bin.
boxplot: |
  A compact visual summary of a datasets distribution, showing the median, interquartile range (IQR), and outliers.
outliers: |
  Data points that are significantly different from the rest of the dataset, often lying far from the median or mean.
density plot: |
  A smoothed curve that represents the distribution of a dataset, showing the probability density of different values.
mean: |
  The average of a dataset, calculated by summing all values and dividing by the number of observations.
standard deviation: |
  A measure of the amount of variation or spread in a dataset, indicating how far data points are from the mean on average.


# ---- Day 4: AI-assisted programming ----
assistant: |
  Any AI tool that helps you write or understand code, from inline completion to a chat window. In this course "assistant" is the general word; "agent" is used when the tool acts on your files.
agent: |
  An assistant that can read across a project's files and, depending on its permission mode, edit them and run commands, such as Claude Code. An agent acts; a chat window only advises.
tool call: |
  A single action an agent takes, such as reading a file, editing a file or running a shell command. Permission rules and hooks act on tool calls.
large language model: |
  A model trained on a large body of text, code included, that predicts the next fragment of text from what came before. Claude, GPT and Gemini are families of large language models; tools such as Claude Code, Posit Assistant and GitHub Copilot send your requests to one.
effort level: |
  How much a model reasons before it answers. In Claude Code it runs from low to max; a higher level can help with hard problems, but it is slower and uses more tokens.
context window: |
  The maximum amount of text a language model can consider in one call. The model has no memory between calls, so it sees only what is in the context window.
permission mode: |
  The setting that decides how much Claude Code may do without asking: plan (read only), default (asks before edits and commands), acceptEdits (edits without asking) and bypassPermissions (never asks).
rung: |
  One level of the autonomy ladder in Block 3, from suggesting a line (rung 0) to acting with no prompts (rung 5). Each step up removes a moment when you would have seen an action before it happened.
instruction file: |
  A file the assistant loads into every conversation, such as AGENTS.md or CLAUDE.md, stating the project's standing conventions. Its contents are requests, not guarantees.
skill: |
  A reusable procedure for one kind of task: a folder containing a SKILL.md file (and optionally scripts and templates) that an assistant loads only when it is invoked by name or judged relevant from its description.
front matter: |
  The block between two lines of three dashes at the top of a file, holding settings such as a skill's name and description, or a Quarto document's options.
canary: |
  A fixed line that an instruction file asks the assistant to include in its output, so that seeing the line shows the file was loaded. It does not show that the other rules were followed.
deny rule: |
  A permission rule in the deny list of .claude/settings.json that stops Claude Code's built-in tools from editing or reading the matching files. It checks shell output redirects such as > file, but not R code or most other commands that change the same files.
hook: |
  A command the assistant runs automatically at a fixed point, for example before every tool call. A hook can block the call, but it matches text, so a differently written command can get past it.
checksum: |
  A short fingerprint computed from a file's contents, for example with tools::md5sum(). Any change to the file changes the checksum, so it detects changes made by any route.
symbolic link: |
  A file-system entry that points to another folder or file, so one copy can appear in two places. On Windows, copying the folder is usually simpler.
continuous integration: |
  Automated checks, such as tests, that run on a server each time changes are pushed or a pull request is opened. In this course, GitHub Actions.
CODEOWNERS: |
  A GitHub file listing who must review changes to which paths. With branch protection, a pull request that touches those paths cannot merge without their review.
branch protection: |
  GitHub repository settings that stop changes reaching a branch such as main unless conditions are met, for example a passing check and an approved review.
reference: |
  In a characterisation test, the saved output of the original, trusted code (stored in tests/fixtures/). A trusted script captures it once, from the unchanged code, before any refactoring, and you commit it. After that, nothing regenerates it except your own recorded decision.
fixture: |
  A file a test reads as fixed input or expected output. In this course, the reference .rds file in tests/fixtures/.
characterisation test: |
  A test that checks new code reproduces the saved output of the original code exactly. It shows the output is unchanged, not that it is correct.
known-answer test: |
  A test that checks code against a result worked out independently, for example by hand. It can show code is correct, where a characterisation test only shows it is unchanged.
sentinel value: |
  A number with a special meaning, such as 9999 for "not recorded" or -1 for "run failed". It must be documented in a codebook and recoded before analysis.
codebook: |
  A table describing each variable: its type, valid range, missing-value codes, unit and label mappings. It is the data dictionary from Day 2 with machine-readable rules, and you own it, not the AI.
lockfile: |
  The renv.lock file that records the R version and the exact package versions a project uses, so renv::restore() can rebuild the same environment.
fresh R session: |
  An R session with nothing loaded from earlier work: Session > Restart R in RStudio or Positron (with "never save .RData" set, as on Day 1), callr::rscript() from the console, or Rscript in the terminal. Code that only works in your current session depends on something you did not record.
equivalence check: |
  A comparison showing that two versions of code, such as an original and an AI translation, give the same output once only presentation (types, row order) is normalised.
AI-use log: |
  A record written at the time of each piece of AI-assisted work, in the form: date; tool and model; task; what you kept or changed. It becomes the AI declaration in a README.
claimed execution: |
  A statement that code runs or reproduces, made without the command that was run and the output it produced. Treat it as a prediction, not evidence.
false positive: |
  In a code review, a problem the AI reports confidently that is not real, or describes wrongly.
AI declaration: |
  A statement, for example in a README, recording that an AI assisted, naming the tool, model and date, and making no claim about AI use beyond what was recorded.
tools: |
  R functions (or other programs) that an agent may ask to have run, each described to the model by a name, a description and its arguments. The model only asks; the harness runs the tool on your computer and sends back the result.
harness: |
  The software around a model that keeps the conversation, sends it to the model, runs the tools the model asks for and sends back their results. Claude Code is a harness; so is a chat object made with ellmer.
turn: |
  One message in a conversation with a model: either yours (the user turn) or the model's reply (the assistant turn). Tool results go back to the model inside a user turn.
request: |
  One call to the model, with the whole conversation so far, and its reply. A single question can take several requests when the model asks for tools before it answers.
token: |
  The unit a model reads and writes, roughly three-quarters of an English word. Providers charge per token, and because the whole conversation is re-sent with each request, a long conversation costs more per question.
system prompt: |
  Standing instructions sent with every request, before the conversation itself. It does the job an instruction file such as AGENTS.md does for Claude Code.
