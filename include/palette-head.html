<script>
// Apply the saved palette, colour-blind mode and text size before the page
// paints (see include/palette.js)
(function () {
  try {
    var root = document.documentElement;
    var p = localStorage.getItem("advancing-r-palette");
    if (p) root.setAttribute("data-palette", p);
    if (localStorage.getItem("advancing-r-cvd") === "on") root.setAttribute("data-cvd", "on");
    var t = parseInt(localStorage.getItem("advancing-r-text"), 10);
    if (t && t !== 100) root.style.setProperty("--text-scale", t / 100);
  } catch (e) {}
})();
</script>
