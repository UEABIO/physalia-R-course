<script>
// Apply the saved colour palette before the page paints (see include/palette.js)
(function () {
  try {
    var p = localStorage.getItem("advancing-r-palette");
    if (p) document.documentElement.setAttribute("data-palette", p);
    if (localStorage.getItem("advancing-r-cvd") === "on") document.documentElement.setAttribute("data-cvd", "on");
  } catch (e) {}
})();
</script>
